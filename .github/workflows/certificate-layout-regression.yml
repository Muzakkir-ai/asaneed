name: Certificate PDF layout regression

on:
  pull_request:
    paths:
      - 'legacy/components/CertificatePrint.tsx'
      - 'legacy/components/MatnFormatting.tsx'
      - 'legacy/components/MatnHeadingControls.tsx'
      - 'legacy/components/QiraatHeadingControls.tsx'
      - 'legacy/components/CertificateHeading.tsx'
      - 'legacy/lib/qiraatHeadingSettings.ts'
      - 'legacy/api/sanadPrintStyle.ts'
      - 'tests/fixtures/certificate-qiraat-layout-review.tsx'
      - 'legacy/lib/certificateFooterLift.ts'
      - 'legacy/lib/matnPresentation.ts'
      - 'legacy/api/certificateDraftFormatting.ts'
      - 'legacy/api/certificateDraftPreview.ts'
      - 'legacy/api/finalizeCertificate.ts'
      - 'legacy/api/studentDirectory.ts'
      - 'legacy/compat/database.ts'
      - 'legacy/components/CertificateForm.tsx'
      - 'legacy/components/CertificateCreation.tsx'
      - 'tests/student-identity.test.ts'
      - 'tests/received-sanad-api.test.cjs'
      - 'legacy/index.css'
      - 'tests/certificate-footer-lift.test.ts'
      - 'tests/certificate-layout-browser.test.cjs'
      - 'tests/fixtures/certificate-layout-review.tsx'
      - '.github/workflows/certificate-layout-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certificate-layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck certificate editor and API
        run: npm run typecheck
      - name: Test spacing, footer lift and schema constraints
        run: npm run test:certificate-layout
      - name: Test student identity and received sanad
        run: |
          npx tsc --ignoreConfig tests/student-identity.test.ts --outDir .vercel/chat04-followup --module commonjs --target es2022 --resolveJsonModule --esModuleInterop --skipLibCheck --types node --noEmitOnError
          node .vercel/chat04-followup/tests/student-identity.test.js
          node tests/received-sanad-api.test.cjs
      - run: npx playwright install --with-deps chromium
      - name: Browser test PDF formatting controls and draft save/reset
        run: node tests/certificate-layout-browser.test.cjs
        env:
          CI: 'true'
          ASANEED_CERTIFICATE_REVIEW_SCREENSHOTS: /tmp
      - name: Upload certificate desktop/mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificate-pdf-layout-screenshots
          path: /tmp/certificate-*.png
          if-no-files-found: ignore
