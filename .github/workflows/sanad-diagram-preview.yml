name: Sanad diagram text preview

on:
  pull_request:
    paths:
      - 'legacy/lib/diagramSanadText.ts'
      - 'legacy/lib/sharedBridge.ts'
      - 'lib/sanad-library.ts'
      - 'tests/shared-bridge.test.ts'
      - 'legacy/components/ShaykhSanadTree.tsx'
      - 'tests/sanad-punctuation.test.ts'
      - '.github/workflows/sanad-diagram-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  text-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:sanad
      - run: npm run test:shared-bridge
